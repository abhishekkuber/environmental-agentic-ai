    title: {en: Maximum storage period}
    permit_types: [PT-1]
    params: {waste_storage_max_days: 60}
    text:
      en: >-
        Waste shall not be stored on site for more than 60 days before it is transferred to a
        licensed waste facility.
  - clause_id: RD-03 Art.4
    article: "4"
    title: {en: Labelling and segregation}
    permit_types: [PT-1]
    text:
      en: >-
        Every waste container shall be labelled with the waste type and the date storage
        began. Hazardous and non-hazardous waste shall be stored separately.
